<title>BK Digital Day · Experience Booth</title>
<style>html{background:#010520}
/* v22 - performance: baked backdrop blur, compositor border light */
.card,.card.active{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;will-change:transform}
.card .bd{position:absolute;left:50%;top:50%;width:2560px;height:1600px;transform-origin:0 0;transform:var(--bt);pointer-events:none;background:0 0/100% 100% no-repeat}
.card .bd0{background-image:url(__BLUR0__)}
.card .bd1{background-image:url(__BLUR1__);opacity:var(--p,0)}
.card::before,.card.active::before{display:none!important;animation:none!important}
.card .bring{position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;opacity:var(--p,0);overflow:hidden;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.card .brot{position:absolute;left:50%;top:50%;width:var(--bD,420px);height:var(--bD,420px);margin:calc(var(--bD,420px)/-2) 0 0 calc(var(--bD,420px)/-2);
  background:linear-gradient(180deg,rgba(255,255,255,.1) -0.8%,rgba(255,255,255,.804) 45.2%,rgba(255,255,255,.1) 84.6%);
  animation:brSpin 7s linear infinite;will-change:transform}
.card:not(.active) .brot{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.card .brot{animation:none;transform:rotate(34.5deg) scale(1,var(--bL0,.9))}}

/* v24 - spotlight on the element to tap */
:root{--spot:.45}
.scr .spot{position:absolute;left:0;top:0;width:0;height:0;z-index:5;pointer-events:none;opacity:0;
  box-shadow:0 0 0 2000px rgba(6,12,40,var(--spot)),0 0 18px 6px rgba(6,12,40,calc(var(--spot)*.6));transition:opacity .45s var(--ease)}
.scr .spot.onsheet{z-index:9}
.scr .spot.off{display:none}
.scr .spot.on{opacity:1}
.scr .spot.pulse{animation:spotPulse .7s var(--ease)}
@keyframes spotPulse{0%{transform:scale(1)}35%{transform:scale(1.06)}100%{transform:scale(1)}}
.scr .spotref{position:absolute;pointer-events:none}
.scr .sheet .hot8{z-index:10}
</style>
<style>
/*__FONTS__*/
:root{
  --ink:#eaf0ff; --muted:rgba(214,226,255,.62);
  --navy:#030b2e; --royal:#0c2c8c;
  --accent:#7b8cff; --accent2:#c07bff;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#010520;color:var(--ink);
  font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ───────────── SCENE ───────────── */
#scene{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 28%,#123fb0 0%,#0a2577 32%,#05124a 58%,#020830 100%)}
#scene svg.land{position:absolute;inset:0;width:100%;height:100%}
.aurora{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;mix-blend-mode:screen;transition:background 1.2s var(--ease)}
.aurora.a1{width:60vw;height:40vh;left:20vw;top:6vh;background:radial-gradient(closest-side,rgba(64,120,255,.8),transparent);animation:drift1 18s ease-in-out infinite alternate}
.aurora.a2{width:40vw;height:34vh;left:44vw;top:14vh;background:radial-gradient(closest-side,var(--accent2),transparent);opacity:.28;animation:drift2 22s ease-in-out infinite alternate}
.aurora.a3{width:46vw;height:30vh;left:6vw;top:18vh;background:radial-gradient(closest-side,var(--accent),transparent);opacity:.24;animation:drift3 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(4vw,3vh) scale(1.1)}}
@keyframes drift2{to{transform:translate(-10vw,4vh) scale(1.2)}}
@keyframes drift3{to{transform:translate(12vw,-3vh) scale(.9)}}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.85}}
.shimmer line{animation:sh 5s ease-in-out infinite}
@keyframes sh{0%,100%{opacity:.08}50%{opacity:.4}}
#vignette{position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 40%,transparent 50%,rgba(0,2,20,.75) 100%)}
#scene.dim .land,#scene.dim .star{filter:brightness(.55) blur(2px);transition:filter .9s var(--ease)}
#scene .land{transition:filter .9s var(--ease)}

/* ───────────── STAGE (1280×800, scaled to fit) ───────────── */
#stage{position:fixed;left:50%;top:50%;width:1280px;height:800px;transform-origin:50% 50%}
header{position:absolute;left:48px;right:48px;top:34px;display:flex;align-items:center;justify-content:space-between;z-index:50}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:-.02em;font-size:22px}
.logo .mark{width:34px;height:34px;border:1.6px solid #fff;display:grid;place-items:center;font-weight:600;font-size:15px;letter-spacing:-.04em;border-radius:3px}
.logo small{font-weight:400;font-size:12px;letter-spacing:.18em;color:var(--muted);margin-left:6px;padding-left:14px;border-left:1px solid rgba(255,255,255,.2)}
.hdr-right{display:flex;gap:10px;align-items:center}
.chip{height:36px;padding:0 16px;border-radius:99px;display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.04em;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:#45f0a5;box-shadow:0 0 10px #45f0a5;animation:tw 2s infinite}
.icon-btn{width:36px;height:36px;padding:0;justify-content:center}

/* ───────────── HOME ───────────── */
#home{position:absolute;inset:0;transition:opacity .6s var(--ease),transform .8s var(--ease)}
#home.away{opacity:0;transform:scale(.94);pointer-events:none}
.hero{position:absolute;top:118px;left:0;right:0;text-align:center}
.greet{font-size:22px;font-weight:300;color:rgba(235,242,255,.85);letter-spacing:.01em;opacity:0;animation:up 1s .2s var(--ease) forwards}
.headline{margin-top:14px;font-size:50px;line-height:1.08;font-weight:500;letter-spacing:-.025em;opacity:0;animation:up 1s .35s var(--ease) forwards}
.headline em{font-style:normal;background:linear-gradient(90deg,#9fb6ff,#d6b8ff 50%,#8fe8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#ring{position:absolute;left:50%;top:10px;width:0;height:0;transform-style:preserve-3d}

.controls{position:absolute;left:0;right:0;top:672px;display:flex;justify-content:center;align-items:center;gap:30px}
.arrow{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 30px -10px rgba(0,0,0,.6);transition:transform .2s}
.arrow:active{transform:scale(.92)}
.dots{display:flex;gap:9px}
.dots span{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.28);transition:all .45s var(--ease)}
.dots span.on{width:30px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.hint{position:absolute;left:0;right:0;top:750px;text-align:center;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.42)}
.hint b{display:inline-block;animation:swipe 2.4s ease-in-out infinite;font-weight:400}
@keyframes swipe{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}

/* ───────────── FLOW ───────────── */
#flow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
#flow.show{pointer-events:auto;opacity:1}
.panel{position:absolute;left:56px;top:122px;width:400px;transform:translateX(-30px);opacity:0;transition:all .8s .15s var(--ease)}
#flow.show .panel{transform:none;opacity:1}
.svc{display:flex;gap:16px;align-items:center}
.svc .ico{width:76px;height:81px;filter:drop-shadow(0 12px 18px color-mix(in srgb,var(--accent) 45%,transparent))}
.svc .ico svg{width:100%;height:100%}
.svc small{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.svc h2{font-size:34px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:2px}
.lead{margin-top:16px;font-size:16px;line-height:1.5;color:rgba(225,233,255,.75);max-width:370px}
.progress{margin-top:26px;height:4px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.progress i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s var(--ease);box-shadow:0 0 14px var(--accent)}
.steps{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:4px}
.steps li{display:flex;align-items:center;gap:14px;padding:9px 12px;border-radius:14px;font-size:15px;color:rgba(255,255,255,.45);transition:all .4s var(--ease)}
.steps li .n{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;border:1px solid rgba(255,255,255,.2);transition:all .4s}
.steps li.done{color:rgba(255,255,255,.7)}
.steps li.done .n{background:rgba(255,255,255,.12);border-color:transparent}
.steps li.cur{color:#fff;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.02));font-weight:500}
.steps li.cur .n{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 0 18px -2px var(--accent)}
.actions{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
.btn{height:46px;padding:0 20px;border-radius:99px;display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 10px 26px -8px var(--accent)}
.btn.on{background:rgba(255,255,255,.92);color:#0b1640}
.btn svg{width:18px;height:18px}

.device{position:absolute;left:600px;top:96px;width:318px;height:660px;transform:translateY(60px) scale(.86) rotateX(8deg);opacity:0;transition:all 1s .05s var(--ease)}
#flow.show .device{transform:none;opacity:1}
.device .glow{position:absolute;inset:40px -60px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 50%,transparent),transparent);filter:blur(30px);opacity:.75}
.phone{position:absolute;inset:0;border-radius:54px;padding:11px;
  background:linear-gradient(145deg,#3a3f52,#11131c 30%,#262a38 70%,#4a4f63);
  box-shadow:0 50px 90px -30px rgba(0,0,10,.9),inset 0 0 0 1.5px rgba(255,255,255,.18),inset 0 0 0 4px #07080d}
.phone::after{content:"";position:absolute;right:-3px;top:150px;width:4px;height:70px;border-radius:3px;background:#2a2e3b}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#f3f5fb}
.island{position:absolute;top:10px;left:50%;width:96px;height:28px;margin-left:-48px;border-radius:20px;background:#000;z-index:30}
#screenHost{position:absolute;inset:0}
.scr{position:absolute;inset:0;animation:scrIn .5s var(--ease)}
.scr.out{animation:scrOut .35s var(--ease) forwards}
@keyframes scrIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes scrOut{to{transform:translateX(-40px);opacity:0}}

/* tour tooltip */
#tip{position:absolute;left:944px;width:280px;padding:18px 20px 18px;border-radius:22px;z-index:40;
  background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.26);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 24px 50px -16px rgba(0,0,20,.7);
  transition:top .55s var(--ease),opacity .4s,transform .4s var(--ease);opacity:0;transform:translateX(16px)}
#tip.on{opacity:1;transform:none}
#tip::before{content:"";position:absolute;left:-8px;top:var(--ay,40px);width:16px;height:16px;transform:translateY(-50%) rotate(45deg);
  background:rgba(255,255,255,.17);border-left:1px solid rgba(255,255,255,.26);border-bottom:1px solid rgba(255,255,255,.26);backdrop-filter:blur(20px)}
#tip .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55)}
#tip .t{margin-top:6px;font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
#tip .d{margin-top:6px;font-size:14px;line-height:1.45;color:rgba(230,236,255,.75)}
#tip .tap{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:13px;color:#fff}
#tip .tap i{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-style:normal;font-size:12px}
#tip.nudge{animation:nudge .5s}
@keyframes nudge{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(6px)}}
#tapLine{position:absolute;height:2px;z-index:35;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55));transition:all .55s var(--ease);opacity:0;transform-origin:left}
#tapLine.on{opacity:1}

/* hot target inside phone */
.hot{position:relative;z-index:5}
.hot::after{content:"";position:absolute;inset:-5px;border-radius:inherit;border:2.5px solid var(--hot,#5b6cff);pointer-events:none;animation:ring 1.6s ease-out infinite}
.hot::before{content:"";position:absolute;inset:-5px;border-radius:inherit;box-shadow:0 0 0 0 var(--hot,#5b6cff);pointer-events:none;animation:ring2 1.6s ease-out infinite}
@keyframes ring{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
@keyframes ring2{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hot) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.finger{position:absolute;width:44px;height:44px;z-index:25;pointer-events:none;opacity:0;transition:all .7s var(--ease)}
.finger.on{opacity:1}
.finger.press{transform:scale(.85)}

/* completion */
#done{position:absolute;inset:0;z-index:45;pointer-events:none}
.confetti{position:absolute;width:8px;height:14px;border-radius:2px;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(900px) rotate(720deg);opacity:.2}}

/* idle overlay */
#idle{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);opacity:0;transition:opacity .4s;z-index:60}
#idle.on{opacity:1}

/* ───────────── PHONE APP UI ───────────── */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:#f2f4fa;color:#0c1638;font-size:13px}
.sb{height:46px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 26px 6px 30px;font-size:13px;font-weight:600}
.sb .r{display:flex;gap:5px;align-items:center}
.top{background:linear-gradient(160deg,#0a1e6e,#0b2d9a 60%,#1747c9);color:#fff;padding-bottom:18px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-60px;top:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.18),transparent)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 18px 0}
.nav .bk{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.15);display:grid;place-items:center}
.nav h4{font-size:17px;font-weight:600;flex:1}
.nav .bk svg{width:18px;height:18px}
.hello{padding:6px 20px 0;display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ffcf9e,#ff8a8a);display:grid;place-items:center;font-weight:700;color:#5a1d1d;font-size:14px;flex:none}
.hello > div:nth-child(2){flex:1}
.hello .bk svg{width:19px;height:19px}
.hello small{font-size:11px;opacity:.7}
.hello b{display:block;font-size:15px;font-weight:600}
.bal{margin:14px 16px 0;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);position:relative;z-index:1}
.bal small{font-size:11px;opacity:.75}
.bal .amt{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.bal .amt span{font-size:13px;font-weight:500;opacity:.8;margin-right:4px}
.bal .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px;opacity:.8}
.body{flex:1;overflow:hidden;padding:14px 16px 0;position:relative}
.sec{font-size:12px;font-weight:600;color:#56608a;margin:4px 2px 10px;display:flex;justify-content:space-between}
.sec a{color:#2b52e0;font-weight:500}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;background:#fff;border-radius:20px;padding:14px 8px;box-shadow:0 6px 20px -12px rgba(10,30,90,.3)}
.qa div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:500;color:#2a3460;border-radius:16px;padding:4px 0}
.qa .g{width:44px;height:44px;border-radius:15px;display:grid;place-items:center}
.qa .g svg{width:21px;height:21px}
.tx{margin-top:14px;background:#fff;border-radius:20px;padding:4px 14px;box-shadow:0 6px 20px -12px rgba(10,30,90,.3)}
.tx .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eef0f7}
.tx .it:last-child{border:0}
.tx .it .g{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none}
.tx .it .g svg{width:16px;height:16px}
.tx .it div{flex:1}
.tx .it b{display:block;font-size:12.5px;font-weight:600}
.tx .it small{font-size:10.5px;color:#8a92b2}
.tx .it em{font-style:normal;font-weight:600;font-size:12.5px}
.tabs{height:70px;flex:none;background:#fff;display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px;border-top:1px solid #e8ebf4}
.tabs div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#9aa1bd}
.tabs div.on{color:#1d44d8;font-weight:600}
.tabs svg{width:20px;height:20px}
.pad{padding:16px}
.list{background:#fff;border-radius:18px;margin-top:14px;padding:2px 14px;box-shadow:0 6px 20px -12px rgba(10,30,90,.3)}
.list .li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eef0f7;font-size:13px;font-weight:500}
.list .li:last-child{border:0}
.list .li .g{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:#eef2ff;color:#2b52e0}
.list .li .g svg{width:16px;height:16px}
.list .li > span:not(.g){flex:1}
.list .li small{color:#8a92b2;font-weight:400;display:block;font-size:11px}
.pbtn{height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14.5px;color:#fff;background:var(--app,#1d44d8);box-shadow:0 10px 20px -10px var(--app,#1d44d8)}
.pbtn.ghost{background:#e9edfb;color:#1d2b66;box-shadow:none}
.pbtn svg{width:18px;height:18px}
.foot{position:absolute;left:16px;right:16px;bottom:28px}
.h1{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:4px 2px 4px}
.sub{font-size:12.5px;color:#6b7399;margin:0 2px 14px;line-height:1.45}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;border:1.5px solid transparent;box-shadow:0 6px 18px -12px rgba(10,30,90,.3)}
.opt.sel{border-color:var(--app)}
.opt .g{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.opt .g svg{width:19px;height:19px}
.opt div{flex:1}
.opt b{display:block;font-size:13.5px}
.opt small{font-size:11px;color:#8a92b2}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #c9cfe4;flex:none}
.opt.sel .radio{border:6px solid var(--app)}
.amtbig{text-align:center;margin:18px 0 6px}
.amtbig small{font-size:12px;color:#6b7399}
.amtbig div{font-size:36px;font-weight:700;letter-spacing:-.03em;margin-top:4px}

/* ══ v15 — Figma frame 104:141 ══ */
header{left:52px;right:52px;top:47px}

/* icons */
.card .ico{width:75.6px;height:80.8px}
.card .ico img{width:100%;height:100%;display:block}
.card:not(.active) .ico img{filter:none}
/* glass: centre card gets a radial glow, stronger blur and a diagonal light border */
.card .glass2{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--p,0);
  background:radial-gradient(75% 60% at 50% 42%,rgba(255,255,255,.24),rgba(255,255,255,.04))}
.card,.card.active{backdrop-filter:blur(calc(50px + 30px*var(--p,0)));-webkit-backdrop-filter:blur(calc(50px + 30px*var(--p,0)))}
.card::before,.card.active::before{padding:1.5px;background:linear-gradient(128deg,rgba(255,255,255,.1),rgba(255,255,255,.8) 54%,rgba(255,255,255,.1))}
.card .ico,.card h3,.card p,.card .foot{position:relative}
/* no hairline: the button grows out of the card's bottom edge */
.card .foot,.card.active .foot{height:calc(38px*var(--e,0));margin-top:calc(18px*var(--e,0))}
.card .foot .cta,.card.active .foot .cta{width:196px;height:38px;border-radius:20px;background-color:#fff;
  opacity:var(--e,0);transform:translate(-50%,-50%) scale(calc(.55 + .45*var(--e,0)))}
.card .foot .cta::before,.card.active .foot .cta::before{display:none}
.card .foot .cta b,.card.active .foot .cta b{font-weight:500;font-size:13px;letter-spacing:0;text-transform:none;color:#034FA3}
/* reflection: a soft streak only */
#reflect{background:none;filter:none;top:630px}
#reflect::after{filter:blur(14px)}

/* ══ v16 — centre card = Figma 104:203 exactly ══ */
.card,.card.active{background:none;
  box-shadow:0 24px 48px -24px rgba(0,3,25,.55),inset 0 .9px 0 rgba(255,255,255,.25)}
.card .glass1{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:calc(1 - var(--p,0));
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04))}
.card .glass2{opacity:var(--p,0);
  background:radial-gradient(303px 179px at 61.5px -11px,rgba(255,255,255,.24),rgba(255,255,255,.04))}
.card::before,.card.active::before{inset:-.9px;padding:1.5px;

/* ══ v17 — border drawn fully inside the card, like Figma's inside stroke ══ */
.card,.card.active{border:0}
.card .glass1{box-shadow:inset 0 0 0 .7px rgba(255,255,255,.22)}
.card::before,.card.active::before{inset:0;padding:1.5px}

/* ══ v18 — border light travels around the card ══ */
@property --bang{syntax:'<angle>';inherits:false;initial-value:214.5deg}
.card::before,.card.active::before{
  background:linear-gradient(var(--bang),rgba(255,255,255,.1) -0.8%,rgba(255,255,255,.804) 45.2%,rgba(255,255,255,.1) 84.6%);

.tback{width:0;height:48px;margin-top:16px;margin-right:0;border-radius:50%;display:grid;place-items:center;overflow:hidden;opacity:0;pointer-events:none;

const START=2; let pos=START, target=START, dragging=false, activeIdx=-1, homeLive=true;
const mod=(a,n)=>((a%n)+n)%n;
function offset(i){let d=mod(i-pos+N/2,N)-N/2;return d}
let BDG={rx:0,ry:0,s:1,c:.5,ox:0,oy:0}, lastLayoutPos=NaN, layoutDirty=true;
function measureBD(){const r=ring.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,c=Math.max(vw/2560,vh/1600);
  BDG={rx:r.left,ry:r.top,s:+stage.dataset.s||1,c,ox:(vw-2560*c)/2,oy:(vh-1600*c)/2};layoutDirty=true}
const lastSt=[];
function layout(){
  if(!layoutDirty&&pos===lastLayoutPos)return; lastLayoutPos=pos; layoutDirty=false;
  const SC=[1,0.697,0.571,0.5], XS=[0,222,393,520];
  cards.forEach((el,i)=>{
    const d=offset(i), ad=Math.abs(d), k=Math.min(Math.floor(ad),2), f=Math.min(ad,3)-k;
    const sc=SC[k]+(SC[k+1]-SC[k])*f, x=Math.sign(d)*(XS[k]+(XS[k+1]-XS[k])*f);
    el.style.transform=`translate3d(${x}px,-50%,0) scale(${sc})`;
    el.style.opacity=ad<=2?1:Math.max(0,1-(ad-2)*2.2);
    el.style.zIndex=100-Math.round(ad*10);
    el.style.setProperty('--k',(1/Math.sqrt(sc)).toFixed(3));
    const p=Math.max(0,1-ad), e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2, t=Math.max(0,Math.min(1,(p-.55)/.45));
    el.style.setProperty('--p',p.toFixed(3));el.style.setProperty('--e',e.toFixed(3));el.style.setProperty('--t',(t*t*(3-2*t)).toFixed(3));
    const g=BDG,ss=sc*g.s;
    el.style.setProperty('--bt',`translate(${((g.ox-g.rx-x*g.s)/ss).toFixed(2)}px,${((g.oy-g.ry)/ss).toFixed(2)}px) scale(${(g.c/ss).toFixed(5)})`);
  });
  const a=mod(Math.round(pos),N);
  if(a!==activeIdx){activeIdx=a;cards.forEach((c,i)=>c.classList.toggle('active',i===a));[...dotsEl.children].forEach((d,i)=>d.classList.toggle('on',i===a));
    const s=SERVICES[a];document.documentElement.style.setProperty('--accent',s.c);document.documentElement.style.setProperty('--accent2',s.c2);}
}
let vel2=0,lastF=performance.now();
function loop(now){ const dt=Math.min(2.5,((now||performance.now())-lastF)/16.667); lastF=now||performance.now();
  if(homeLive){ if(!dragging){ for(let i=0;i<Math.round(dt*2)||0;i++){ vel2+=(target-pos)*0.026; vel2*=0.70; pos+=vel2; }

    const ks=[[167.5,503.5],[375.5,503.5],[583.5,503.5],[167.5,711.5],[375.5,711.5],[583.5,711.5],[167.5,903.5],[375.5,903.5],[583.5,903.5],[375.5,1095.5]].map(p=>[p[0]/2,p[1]/2]);
    const lab=['1','2','3','4','5','6','7','8','9','0'];
    let pk=ks.map(([cx,cy],i)=>`<button class="pk" data-k="${lab[i]}" aria-label="${lab[i]}" style="left:${cx-36}px;top:${cy-36-CUT}px;background-image:url(${SCR[st.pin]});background-size:375px ${h}px;background-position:${-(cx-36)}px ${-(cy-36)}px"></button>`).join('');
    pk+=`<button class="pk del" data-k="del" aria-label="Delete" style="left:266px;top:${548-24-CUT}px"></button>`;
    pk+=`<i class="spotref" style="left:36px;top:${128-CUT}px;width:303px;height:466px;border-radius:28px"></i>`;
    pk+=[140,172,204,236].map(x=>`<i class="pd" style="left:${x-8}px;top:${152-8-CUT}px"></i>`).join('');
    html=html.replace('</div>'+(where==='scroll'?hot:'')+'</div>', '</div>'+(where==='scroll'?hot:'')+pk+'</div>');
  }
  if(!st.sheet&&(st.top===96||st.top===104||st.img==='card_2'||st.img==='send_8'||st.pin)){
    if(top>CUT) html=html.replace(/(<div class="pin" style="top:0;[^"]*">)/,'$1<button class="bkz" aria-label="Back" style="left:0;top:0"></button>');
    else html=html.replace('<div class="simg"','<button class="bkz" aria-label="Back" style="left:0;top:0"></button><div class="simg"');
  }
  if(st.sheet){
    let sh='';
    if(st.hot){const [x,y,w,hh,r]=st.hot; sh=`<div class="hot8" data-hot style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px;border-radius:${r}px"></div>`;}
    const btn=(k,r)=>r?`<button class="sbtn" data-a="${k}" aria-label="${k==='ok'?'OK':'Close'}" style="left:${r[0]}px;top:${r[1]}px;width:${r[2]}px;height:${r[3]}px;border-radius:${r[4]}px"></button>`:'';
    html+=`<div class="sheet" style="background-image:url(${SCR[st.sheet]})">${sh}${btn('ok',st.ok)}${btn('x',st.x)}</div>`;
  }
  return `<div class="content">${html}</div><div class="sbg" style="background:linear-gradient(90deg,${c[0]},${c[1]})"></div>`+(st.sheet?'<div class="dim"></div>':'');
}
function scrollToHot(scr,st){
  if(!st.hot||st.sheet) return; const sv=scr.querySelector('.sv'); const [x,y,w,hh]=st.hot; const top=st.top||0, bot=st.bot||0;
  if(bot && y>=st.h-bot) return; if(top && y+hh<=top) return;
  const pinTop=Math.max(0,top-CUT), visH=V-pinTop-bot; let t=(y-CUT)+hh/2-(pinTop+visH/2); t=Math.max(0,Math.min(st.h-CUT-V,t));
  if(t>4) sv.scrollTo({top:t,behavior:'smooth'});
}
function sbarTone(st){const c=(SCOL[st.img]||['#0b4ea2'])[0];const n=parseInt(c.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000>150?'dark':'light';}

const flow=document.getElementById('flow'), home=document.getElementById('home'), scene=document.getElementById('scene');
const host=document.getElementById('screenHost'), tip=document.getElementById('tip'), line=document.getElementById('tapLine'), finger=document.getElementById('finger');
let svc=null, step=0, auto=false, autoTimer=null;

document.getElementById('tBack').onclick=()=>{poke();if(homeLive)return;goHome()};
function openFlow(i){
  document.body.classList.add('inflow');
  if(!homeLive)return; homeLive=false; svc=SERVICES[i]; step=0; auto=false;
  const el=cards[i]; el.style.transition='transform .7s cubic-bezier(.22,1,.36,1),opacity .5s'; el.style.transform+=' translateZ(260px)'; el.style.opacity=0;
  setTimeout(()=>{el.style.transition='';},800);
  home.classList.add('away'); scene.classList.add('dim');
  document.getElementById('fIco').innerHTML=`<img src="${ICO[svc.key]}" alt="" style="width:100%;height:100%">`;
  document.getElementById('fTitle').textContent=svc.name;
  document.getElementById('fLead').textContent=svc.lead;
  document.getElementById('fSteps').innerHTML=svc.steps.map((s,k)=>`<li data-k="${k}"><span class="n">${k+1}</span>${s.t}</li>`).join('');
  [...document.getElementById('fSteps').children].forEach(li=>li.onclick=()=>{poke();const k=+li.dataset.k;if(k!==step){step=k;renderStep()}});
  host.style.setProperty('--app',svc.app); host.parentElement.style.setProperty('--app',svc.app);
  host.innerHTML='';
  setTimeout(()=>{flow.classList.add('show');renderStep(true)},250);
}
function actionsFor(fin){
  const a=document.getElementById('fActions');
  a.innerHTML = fin
   ? `<button class="btn primary" id="aHome">${gi('home','#fff')}Try another service</button><button class="btn" id="aReplay">↻ Replay</button>`
   : `<button class="btn" id="aHome">Back home</button><button class="btn ${auto?'on':''}" id="aAuto">${auto?'Pause':'Show me'}</button>`;
  const q=id=>document.getElementById(id);
  q('aHome').onclick=goHome;
  if(fin){q('aReplay').onclick=()=>{step=0;renderStep()};}
  else{q('aAuto').onclick=()=>{auto=!auto;actionsFor(false);if(auto)scheduleAuto();else clearTimeout(autoTimer)};
}
}
function renderStep(first){
  clearTimeout(autoTimer);
  const st=svc.steps[step], total=svc.steps.length;
  const old=host.querySelector('.scr'); if(old&&!first){old.classList.add('out');setTimeout(()=>old.remove(),340)} else if(old) old.remove();
  const s=document.createElement('div');s.className='scr';s.innerHTML=screenHTML(st);host.appendChild(s);document.querySelector('.sbar').className='sbar '+sbarTone(st);
  const sv=s.querySelector('.sv'); sv.addEventListener('scroll',()=>{const h2=s.querySelector('[data-hot]'); if(h2&&tip.classList.contains('on'))placeTip(h2,st,step);},{passive:true});
  [...document.getElementById('fSteps').children].forEach((li,k)=>{li.className=k<step?'done':k===step?'cur':'';li.querySelector('.n').textContent=k<step?'✓':k+1});
  {const ul=document.getElementById('fSteps'),cur=ul.children[step];if(cur){ul.scrollTo({top:Math.max(0,cur.offsetTop-ul.clientHeight/2+cur.offsetHeight/2),behavior:'smooth'});}}
  document.getElementById('fProg').style.width=(step/(total-1)*100)+'%';
  actionsFor(!!st.fin);
  tip.classList.remove('on');line.classList.remove('on');finger.classList.remove('on');
  s.querySelectorAll('.sbtn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();poke();
    if(b.dataset.a==='ok'){step=0;renderStep();return}
    const sh=s.querySelector('.sheet'),dm=s.querySelector('.dim');sh&&sh.classList.add('closing');dm&&dm.classList.add('closing');
    setTimeout(()=>{sh&&sh.remove();dm&&dm.remove()},420)}));
  if(st.fin){celebrate();return}
  s.querySelectorAll('.bkz').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();poke();if(step>0){step--;renderStep()}else goHome()}));
  const hot=s.querySelector('[data-hot]');
  if(st.pin){pinCode=[];hot.style.pointerEvents='none';s.querySelectorAll('.pk').forEach(b=>b.addEventListener('pointerdown',e=>{e.stopPropagation();pinPress(s,b)}));s.querySelectorAll('.pk').forEach(b=>b.addEventListener('click',e=>e.stopPropagation()));}
  else hot.addEventListener('click',e=>{e.stopPropagation();advance()});
  const spot=document.createElement('i');spot.className='spot'+(st.sheet?' onsheet':'')+(step===0||st.spot?'':' off');s.appendChild(spot);
  const ref=s.querySelector('.spotref')||hot;
  const placeSpot=()=>{if(!ref.isConnected)return;const sr=s.getBoundingClientRect(),r=ref.getBoundingClientRect(),k=sr.width/375||1;
    const pad=4;spot.style.left=((r.left-sr.left)/k-pad)+'px';spot.style.top=((r.top-sr.top)/k-pad)+'px';spot.style.width=(r.width/k+pad*2)+'px';spot.style.height=(r.height/k+pad*2)+'px';
    spot.style.borderRadius=(parseFloat(getComputedStyle(ref).borderTopLeftRadius)||10)+pad+'px'};
  sv.addEventListener('scroll',placeSpot,{passive:true});
  requestAnimationFrame(placeSpot);setTimeout(()=>{placeSpot();spot.classList.add('on')},first?1050:650);
  s.addEventListener('click',()=>{tip.classList.remove('nudge');void tip.offsetWidth;tip.classList.add('nudge');spot.classList.remove('pulse');void spot.offsetWidth;spot.classList.add('pulse')});
  setTimeout(()=>{scrollToHot(s,st);setTimeout(()=>placeTip(hot,st,step),380);},first?700:300);
  if(auto)scheduleAuto();
}
function placeTip(hot,st,k){
  if(!hot.isConnected)return;
  const sc=+stage.dataset.s||1, sr=stage.getBoundingClientRect(), r=hot.getBoundingClientRect();
  const cy=(r.top+r.height/2-sr.top)/sc, rx=(r.right-sr.left)/sc;
  document.getElementById('tipK').textContent=`Step ${k+1} of ${svc.steps.length-1}`;
  document.getElementById('tipT').textContent=st.tip;document.getElementById('tipH').textContent=st.pin?'Use the keypad on the phone':'Tap the glowing button'; document.getElementById('tipD').textContent=st.d;
  const h=tip.offsetHeight||150; let top=Math.max(110,Math.min(800-h-30,cy-h/2));
  tip.style.top=top+'px'; tip.style.setProperty('--ay',(cy-top)+'px'); tip.classList.add('on');
  const x0=Math.min(rx+8,946); line.style.left=x0+'px';line.style.top=cy+'px';line.style.width=(958-x0)+'px';line.classList.add('on');
}
let pinCode=[];
function pinPress(s,b){
  poke(); const k=b.dataset.k; if(pinCode.length>=4&&k!=='del')return;
  b.classList.add('down'); setTimeout(()=>b.classList.remove('down'),180);
  if(k==='del') pinCode.pop(); else pinCode.push(k);
  s.querySelectorAll('.pd').forEach((d,i)=>d.classList.toggle('on',i<pinCode.length));
  if(pinCode.length===4){const at=step;setTimeout(()=>{if(step===at&&svc.steps[step].pin)advance()},450)}
}
function advance(){ poke(); const st=svc.steps[step]; if(st.fin)return; step++; renderStep() }
function scheduleAuto(){ clearTimeout(autoTimer); autoTimer=setTimeout(()=>{
  const scr0=host.querySelector('.scr:last-child');
  if(auto&&svc.steps[step].pin&&scr0){const seq=['1','9','6','0'];let i=0;const sc=+stage.dataset.s||1,pr=host.getBoundingClientRect();
    finger.classList.add('on');
    const tapNext=()=>{if(!auto||!scr0.isConnected)return;const b=scr0.querySelector(`.pk[data-k="${seq[i]}"]`);const r=b.getBoundingClientRect();
      finger.style.left=((r.left-pr.left+r.width/2)/(sc*DEV)-22)+'px';finger.style.top=((r.top-pr.top+r.height/2)/(sc*DEV)-22)+'px';
      setTimeout(()=>{finger.classList.add('press');pinPress(scr0,b);setTimeout(()=>finger.classList.remove('press'),150);i++;if(i<4)setTimeout(tapNext,320)},380)};
    tapNext();return;}
  const hot=host.querySelector('.scr:last-child [data-hot]'); if(!hot||!auto)return; scrollToHot(host.querySelector('.scr:last-child'),svc.steps[step]);
  const hr=hot.getBoundingClientRect(), pr=host.getBoundingClientRect(), sc=+stage.dataset.s||1;
  finger.style.left=((hr.left-pr.left+hr.width/2)/(sc*DEV)-22)+'px'; finger.style.top=((hr.top-pr.top+hr.height/2)/(sc*DEV)-22)+'px';
  finger.classList.add('on'); setTimeout(()=>finger.classList.add('press'),650); setTimeout(()=>{finger.classList.remove('press');advance()},900);
 },2600)}
function celebrate(){
  const d=document.getElementById('done'); d.innerHTML='';
  const cols=[svc.c,svc.c2,'#fff','#ffe27a'];
  for(let i=0;i<70;i++){const c=document.createElement('i');c.className='confetti';c.style.left=(480+Math.random()*560)+'px';c.style.background=cols[i%4];
    c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=(Math.random()*.5)+'s';c.style.transform=`rotate(${Math.random()*360}deg)`;d.appendChild(c)}
  setTimeout(()=>d.innerHTML='',3800);
}
function goHome(){
  document.body.classList.remove('inflow');
  clearTimeout(autoTimer); auto=false; flow.classList.remove('show'); tip.classList.remove('on'); line.classList.remove('on'); finger.classList.remove('on');
  setTimeout(()=>{home.classList.remove('away');scene.classList.remove('dim');homeLive=true;layoutDirty=true;layout();},350);
}

/* ═════════════ IDLE / ATTRACT MODE ═════════════ */
let lastTouch=Date.now(), attract=null;
function poke(){lastTouch=Date.now();document.getElementById('idle').classList.remove('on');if(attract){clearInterval(attract);attract=null}}
addEventListener('pointerdown',poke,true);
setInterval(()=>{const idle=(Date.now()-lastTouch)/1000;
  if(!homeLive){ if(auto) return; if(idle>50)document.getElementById('idle').classList.add('on'); if(idle>60){goHome();target=Math.round(pos)+offset(START);poke();} }
  else if(idle>20&&!attract){attract=setInterval(()=>{if(homeLive&&!dragging)go(1)},4000)}
},1000);
</script>
